<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Knight Lab — Mofil</title>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Knight preview. Drag to orbit, scroll to zoom."></canvas>

    <div class="hud">
      <h1>Knight Lab</h1>
      <div id="clips">
        <p id="no-clips" hidden>No animations in this file</p>
        <label class="sr-only" for="clip">Animation</label>
        <select id="clip" hidden></select>
      </div>
      <label class="row"><input type="checkbox" id="skeleton" /> show skeleton</label>
      <label class="row">speed <input type="range" id="speed" min="0" max="2" step="0.05" value="1" aria-label="Animation speed" /></label>
      <a class="editor" href="./editor/">open rig editor →</a>
    </div>

    <p id="stats" aria-live="polite"></p>
    <p id="loading" role="status">Loading knight…</p>

    <script type="module" src="../src/lab/viewer.js"></script>
  </body>
</html>
